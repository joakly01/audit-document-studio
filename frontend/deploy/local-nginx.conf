server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/audit-document-studio/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/audit-document-studio.access.log;
    error_log /var/log/nginx/audit-document-studio.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Replace with the authenticated business gateway after backend integration.
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        return 503 '{"code":503,"message":"业务接口尚未配置，请完成后端对接后使用。"}';
    }

    location ~ (^|/)\. { return 404; }
    location ~ \.(map|vue|ts)$ { return 404; }
    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }
    location = /demo/index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }
    location /demo/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ =404;
    }
}
