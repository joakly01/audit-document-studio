name: Import verified project snapshot
on:
  push:
    paths:
      - '.github/workflows/import-project-snapshot.yml'
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, '[run project import]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo 'Snapshot import is being prepared.'
