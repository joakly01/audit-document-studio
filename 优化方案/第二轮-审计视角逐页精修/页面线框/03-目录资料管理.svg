<text x="1375" y="673" xml:space="preserve" font-size="15" fill="#215eb8">完成管理</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">已勾选1份资料用于移出；不会删除原文件，移出后可撤销。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">用现有目录列表组件做管理抽屉，不必重写整棵树；分页和懒加载保留。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">中间原文区不再承担删除和全选，左栏普通模式不显示容易误解的执行勾选。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">文件行点击只预览；浏览目录、管理勾选与执行范围分别存储。</text>
</svg>