<text x="717" y="522" xml:space="preserve" font-size="13" fill="#215eb8">来源：03月10日 · 进展汇报</text>
<text x="344" y="558" xml:space="preserve" font-size="14" fill="#6b7b90">以上回答涉及2个议题，点击来源查看详情。</text>
<rect x="326" y="608" width="649" height="74" rx="6" fill="white" stroke="#dce3ed"/>
