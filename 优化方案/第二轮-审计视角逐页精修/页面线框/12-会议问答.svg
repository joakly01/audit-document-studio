<text x="1172" y="465" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">可以这样问</text>
<text x="1172" y="503" xml:space="preserve" font-size="15" fill="#215eb8">涉及预算调整的讨论有哪些？</text>
<text x="1172" y="532" xml:space="preserve" font-size="15" fill="#215eb8">某项目有哪些后续工作安排？</text>
