<text x="84" y="673" xml:space="preserve" font-size="15" fill="white">执行</text>
<rect x="308" y="244" width="830" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="326" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">资料与字段对应</text>
<text x="329" y="311" xml:space="preserve" font-size="16" fill="#263a53">当前文件：工程项目台账.xlsx</text>
<rect x="326" y="342" width="793" height="36" rx="0" fill="#eef2f7"/>
<text x="336" y="366" xml:space="preserve" font-size="14" fill="#6b7b90">业务字段</text>
<text x="566" y="366" xml:space="preserve" font-size="14" fill="#6b7b90">实际表头</text>
<text x="976" y="366" xml:space="preserve" font-size="14" fill="#6b7b90">状态</text>
<text x="336" y="400" xml:space="preserve" font-size="14" fill="#263a53">项目名称</text>
<text x="566" y="400" xml:space="preserve" font-size="14" fill="#263a53">项目名称 ▾</text>
<text x="976" y="400" xml:space="preserve" font-size="14" fill="#263a53">已对应</text>
<path d="M326 427 h793" stroke="#dce3ed"/>
<rect x="326" y="427" width="793" height="49" rx="0" fill="#f8fafc"/>
<text x="336" y="449" xml:space="preserve" font-size="14" fill="#263a53">总投资（万元）</text>
<text x="566" y="449" xml:space="preserve" font-size="14" fill="#263a53">计划投资（万元） ▾</text>
<text x="976" y="449" xml:space="preserve" font-size="14" fill="#263a53">已对应</text>
<path d="M326 476 h793" stroke="#dce3ed"/>
<text x="336" y="498" xml:space="preserve" font-size="14" fill="#263a53">建设地点</text>
<text x="566" y="498" xml:space="preserve" font-size="14" fill="#263a53">项目地点 ▾</text>
<text x="976" y="498" xml:space="preserve" font-size="14" fill="#263a53">已对应</text>
<path d="M326 525 h793" stroke="#dce3ed"/>
<rect x="326" y="525" width="793" height="49" rx="0" fill="#f8fafc"/>
<text x="336" y="547" xml:space="preserve" font-size="14" fill="#263a53">建设内容</text>
<text x="566" y="547" xml:space="preserve" font-size="14" fill="#263a53">请选择列 ▾</text>
<text x="976" y="547" xml:space="preserve" font-size="14" fill="#263a53">待对应</text>
<path d="M326 574 h793" stroke="#dce3ed"/>
<text x="329" y="621" xml:space="preserve" font-size="15" fill="#986515">建设内容尚未对应列名，请从当前表格的已有列名中选择。</text>
<rect x="1154" y="244" width="390" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1172" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">分析设置</text>
<text x="1172" y="311" xml:space="preserve" font-size="15" fill="#6b7b90">重复项目模板</text>
<rect x="1172" y="323" width="354" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1184" y="347" xml:space="preserve" font-size="15" fill="#263a53">重复项目检测模板 ▾</text>
<text x="1172" y="394" xml:space="preserve" font-size="15" fill="#6b7b90">主子项目模板</text>
<rect x="1172" y="406" width="354" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1184" y="430" xml:space="preserve" font-size="15" fill="#263a53">主子项目分析模板 ▾</text>
<text x="1172" y="489" xml:space="preserve" font-size="15" fill="#6b7b90">两类模板均为当前流程必需。</text>
<text x="1172" y="541" xml:space="preserve" font-size="16" fill="#215eb8">▸ 高级评分与阈值</text>
<text x="1172" y="592" xml:space="preserve" font-size="16" fill="#263a53">输出：重复项目 / 主子项目</text>
<text x="1172" y="647" xml:space="preserve" font-size="15" fill="#215eb8">查看规则与分析范围</text>
<rect x="72" y="650" width="204" height="34" rx="4" fill="#e5e9ef"/>
<text x="84" y="673" xml:space="preserve" font-size="15" fill="#8793a3">执行</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">还需完成1项列对应：建设内容。点击未就绪项可直接定位。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">首层是业务字段与表头，评分权重、阈值、提示词折叠。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">两类模板和评分算法保留；单位不一致不由前端自动换算。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">结果优先关系与原因，原始分数不能改名为百分比相似率。</text>
</svg>