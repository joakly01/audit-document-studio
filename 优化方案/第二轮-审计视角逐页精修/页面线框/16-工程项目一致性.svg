<text x="83" y="361" xml:space="preserve" font-size="14" fill="#6b7b90">搜索本次资料</text>
<text x="72" y="405" xml:space="preserve" font-size="15" fill="#263a53" font-weight="700">▾ 工程台账</text>
<rect x="65" y="419" width="218" height="34" rx="3" fill="#edf4ff"/>
<text x="84" y="442" xml:space="preserve" font-size="14" fill="#215eb8">工程项目台账.xlsx</text>
