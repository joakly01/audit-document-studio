<text x="58" y="163" xml:space="preserve" font-size="22" fill="#263a53" font-weight="700">工程项目数据一致性分析</text>
<rect x="405" y="142" width="175" height="26" rx="4" fill="#edf4ff"/>
<text x="414" y="160" xml:space="preserve" font-size="13" fill="#215eb8">字段配置</text>
<text x="1365" y="162" xml:space="preserve" font-size="15" fill="#215eb8">任务中心   关闭 ×</text>
<text x="58" y="207" xml:space="preserve" font-size="17" fill="#6b7b90">对应台账字段，识别疑似重复项目和主子项目关系。</text>
<path d="M40 226 h1520" stroke="#dce3ed"/>
<rect x="56" y="244" width="236" height="458" rx="6" fill="#f9fbfd" stroke="#dce3ed"/>
