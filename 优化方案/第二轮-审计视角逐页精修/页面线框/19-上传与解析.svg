<text x="1208" y="373" xml:space="preserve" font-size="14" fill="#263a53">返回目录使用工具</text>
<path d="M58 422 h1486" stroke="#dce3ed"/>
<rect x="58" y="422" width="1486" height="71" rx="0" fill="#f8fafc"/>
<text x="68" y="444" xml:space="preserve" font-size="14" fill="#263a53">补充协议.pdf</text>
<text x="538" y="444" xml:space="preserve" font-size="14" fill="#263a53">已完成</text>
<text x="838" y="444" xml:space="preserve" font-size="14" fill="#263a53">正在解析</text>
<text x="1208" y="444" xml:space="preserve" font-size="14" fill="#215eb8">查看解析进度</text>
<path d="M58 493 h1486" stroke="#dce3ed"/>
<text x="68" y="515" xml:space="preserve" font-size="14" fill="#263a53">附件一.pdf</text>
<text x="538" y="515" xml:space="preserve" font-size="14" fill="#263a53">正在上传 65%</text>
<text x="838" y="515" xml:space="preserve" font-size="14" fill="#263a53">尚未开始</text>
<text x="1208" y="515" xml:space="preserve" font-size="14" fill="#263a53">继续等待上传</text>
<path d="M58 564 h1486" stroke="#dce3ed"/>
<rect x="58" y="564" width="1486" height="71" rx="0" fill="#f8fafc"/>
<text x="68" y="586" xml:space="preserve" font-size="14" fill="#263a53">附件二.pdf</text>
<text x="538" y="586" xml:space="preserve" font-size="14" fill="#263a53">上传失败</text>
<text x="838" y="586" xml:space="preserve" font-size="14" fill="#263a53">尚未开始</text>
<text x="1208" y="586" xml:space="preserve" font-size="14" fill="#263a53">重试上传</text>
<path d="M58 635 h1486" stroke="#dce3ed"/>
<rect x="59" y="663" width="1484" height="38" rx="6" fill="#edf4ff"/>
<text x="76" y="689" xml:space="preserve" font-size="15" fill="#215eb8">可以关闭此窗口，通过“上传记录”继续查看状态。</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">4份资料：1份可分析，1份正在解析，1份正在上传，1份上传失败。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">目标目录先明确，失败行说明失败在哪个阶段，原文件名保留。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">沿用既有分片与会话机制；本轮改善状态与恢复入口，不重建上传服务。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">本图是上传记录，工具内“添加文件”仍表示选择已有资料。</text>
</svg>