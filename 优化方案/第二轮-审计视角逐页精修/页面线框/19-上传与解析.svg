<rect x="405" y="142" width="175" height="26" rx="4" fill="#edf4ff"/>
<text x="414" y="160" xml:space="preserve" font-size="13" fill="#215eb8">上传与解析</text>
<text x="1365" y="162" xml:space="preserve" font-size="15" fill="#215eb8">任务中心   关闭 ×</text>
<text x="58" y="207" xml:space="preserve" font-size="17" fill="#6b7b90">上传到：项目空间 / 示例项目 / 合同资料；上传完成后还需要完成解析。</text>
<path d="M40 226 h1520" stroke="#dce3ed"/>
<rect x="61" y="249" width="175" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="73" y="272" xml:space="preserve" font-size="15" fill="#215eb8">添加本地文件</text>
<rect x="253" y="249" width="185" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="265" y="272" xml:space="preserve" font-size="15" fill="#215eb8">添加本地文件夹</text>
<text x="1040" y="272" xml:space="preserve" font-size="15" fill="#6b7b90">格式与大小限制以当前服务规则为准</text>
<rect x="58" y="315" width="1486" height="36" rx="0" fill="#eef2f7"/>
<text x="68" y="339" xml:space="preserve" font-size="14" fill="#6b7b90">文件名称</text>
<text x="538" y="339" xml:space="preserve" font-size="14" fill="#6b7b90">上传</text>
<text x="838" y="339" xml:space="preserve" font-size="14" fill="#6b7b90">解析</text>
<text x="1208" y="339" xml:space="preserve" font-size="14" fill="#6b7b90">当前可做什么</text>
<text x="68" y="373" xml:space="preserve" font-size="14" fill="#263a53">采购合同.pdf</text>
<text x="538" y="373" xml:space="preserve" font-size="14" fill="#263a53">已完成</text>
