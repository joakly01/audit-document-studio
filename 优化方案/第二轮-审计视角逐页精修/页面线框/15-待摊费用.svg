<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>待摊费用：逐页精修设计</title>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f4f6fa"/>
<text x="40" y="48" xml:space="preserve" font-size="29" fill="#263a53" font-weight="700">15 / 待摊费用</text>
<text x="40" y="84" xml:space="preserve" font-size="16" fill="#6b7b90">静态设计评审 · 保留现有业务流程 · 示例名称、内容及数量均为虚构</text>
<rect x="1323" y="29" width="233" height="26" rx="4" fill="#edf4ff"/>
<text x="1332" y="47" xml:space="preserve" font-size="13" fill="#215eb8">V0.2 · 最小改动</text>
<rect x="40" y="126" width="1520" height="642" rx="6" fill="white" stroke="#dce3ed"/>
<text x="58" y="163" xml:space="preserve" font-size="22" fill="#263a53" font-weight="700">待摊费用</text>
<rect x="405" y="142" width="175" height="26" rx="4" fill="#edf4ff"/>
<text x="414" y="160" xml:space="preserve" font-size="13" fill="#215eb8">待填写计费基数</text>
<text x="1365" y="162" xml:space="preserve" font-size="15" fill="#215eb8">任务中心   关闭 ×</text>
<text x="58" y="207" xml:space="preserve" font-size="17" fill="#6b7b90">提取合同中的计费约定，填写计费基数，生成费用计算报告。</text>
<path d="M40 226 h1520" stroke="#dce3ed"/>
<rect x="56" y="244" width="236" height="458" rx="6" fill="#f9fbfd" stroke="#dce3ed"/>
<text x="72" y="276" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">本次资料 · 1份合同</text>
<rect x="72" y="291" width="204" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="84" y="314" xml:space="preserve" font-size="15" fill="#215eb8">＋ 添加文件</text>
<rect x="72" y="339" width="204" height="32" rx="6" fill="white" stroke="#dce3ed"/>
<text x="83" y="361" xml:space="preserve" font-size="14" fill="#6b7b90">搜索本次资料</text>
<text x="72" y="405" xml:space="preserve" font-size="15" fill="#263a53" font-weight="700">▾ 合同资料</text>
<rect x="65" y="419" width="218" height="34" rx="3" fill="#edf4ff"/>
<text x="84" y="442" xml:space="preserve" font-size="14" fill="#215eb8">工程合同.pdf</text>
<text x="72" y="610" xml:space="preserve" font-size="14" fill="#215eb8">管理资料 / 查看执行范围</text>
<rect x="72" y="650" width="204" height="34" rx="4" fill="#215eb8" stroke="#215eb8"/>
<text x="84" y="673" xml:space="preserve" font-size="15" fill="white">计算并生成报告</text>
<rect x="308" y="244" width="830" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="326" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">① 提取约定已完成  →  ② 填写基数  →  ③ 查看报告</text>
<rect x="327" y="296" width="130" height="26" rx="4" fill="#edf4ff"/>
<text x="336" y="314" xml:space="preserve" font-size="13" fill="#215eb8">计费约定</text>
<text x="485" y="314" xml:space="preserve" font-size="15" fill="#215eb8">文件原文</text>
<rect x="326" y="344" width="793" height="176" rx="6" fill="#f9fbfd" stroke="#dce3ed"/>
<text x="344" y="377" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">提取的计费约定</text>
<text x="344" y="418" xml:space="preserve" font-size="16" fill="#263a53">示例约定：按合同约定的计费方式及条件计算相关费用，具体标准见合同条款。请对照原文核验。</text>
<text x="327" y="567" xml:space="preserve" font-size="15" fill="#6b7b90">计费基数（元）</text>
<rect x="327" y="579" width="791" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="339" y="603" xml:space="preserve" font-size="15" fill="#263a53">请输入数值</text>
<text x="327" y="639" xml:space="preserve" font-size="14" fill="#6b7b90">基数含义按当前费用类型给出业务说明。</text>
<rect x="1154" y="244" width="390" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1172" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">本次费用分析</text>
<text x="1172" y="311" xml:space="preserve" font-size="15" fill="#6b7b90">费用类型</text>
<rect x="1172" y="323" width="354" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1184" y="347" xml:space="preserve" font-size="15" fill="#263a53">工程监理费（示意）</text>
<text x="1172" y="395" xml:space="preserve" font-size="15" fill="#6b7b90">所用资料</text>
<rect x="1172" y="407" width="354" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1184" y="431" xml:space="preserve" font-size="15" fill="#263a53">工程合同.pdf</text>
<text x="1172" y="490" xml:space="preserve" font-size="15" fill="#263a53">提取模板：本次配置（只读）</text>
<text x="1172" y="539" xml:space="preserve" font-size="15" fill="#215eb8">▸ 查看分析要求</text>
<text x="1172" y="601" xml:space="preserve" font-size="15" fill="#6b7b90">计算失败会保留已提取约定和基数，可重试当前阶段</text>
<text x="1172" y="627" xml:space="preserve" font-size="15" fill="#6b7b90">。</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">计费约定已提取；请填写计费基数（元），然后计算并生成报告。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">复用现有两阶段服务；把“智能体输出”改成“提取的计费约定”。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">单位元始终可见；基数业务含义按费用类型定义，不擅自套用其他金额。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">保留待摊费用名称并补副标题，不误画成会计期间摊销工具。</text>
</svg>