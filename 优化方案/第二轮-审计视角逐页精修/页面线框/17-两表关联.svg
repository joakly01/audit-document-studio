<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>两表项目关联度：逐页精修设计</title>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f4f6fa"/>
<text x="40" y="48" xml:space="preserve" font-size="29" fill="#263a53" font-weight="700">17 / 两表项目关联度</text>
<text x="40" y="84" xml:space="preserve" font-size="16" fill="#6b7b90">静态设计评审 · 保留现有业务流程 · 示例名称、内容及数量均为虚构</text>
<rect x="1323" y="29" width="233" height="26" rx="4" fill="#edf4ff"/>
<text x="1332" y="47" xml:space="preserve" font-size="13" fill="#215eb8">V0.2 · 最小改动</text>
<rect x="40" y="126" width="1520" height="642" rx="6" fill="white" stroke="#dce3ed"/>
<text x="58" y="163" xml:space="preserve" font-size="22" fill="#263a53" font-weight="700">两表项目关联度</text>
<rect x="405" y="142" width="175" height="26" rx="4" fill="#edf4ff"/>
<text x="414" y="160" xml:space="preserve" font-size="13" fill="#215eb8">字段配置</text>
<text x="1365" y="162" xml:space="preserve" font-size="15" fill="#215eb8">任务中心   关闭 ×</text>
<text x="58" y="207" xml:space="preserve" font-size="17" fill="#6b7b90">选择两张表并对应字段，查找可能关联的项目记录。</text>
<path d="M40 226 h1520" stroke="#dce3ed"/>
<rect x="56" y="244" width="330" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="74" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">对比资料</text>
<text x="74" y="311" xml:space="preserve" font-size="15" fill="#6b7b90">表一 · 待查项目表</text>
<rect x="74" y="323" width="294" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="86" y="347" xml:space="preserve" font-size="15" fill="#263a53">立项台账.xlsx</text>
<rect x="74" y="365" width="120" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="86" y="388" xml:space="preserve" font-size="15" fill="#215eb8">更换表一</text>
<text x="74" y="449" xml:space="preserve" font-size="15" fill="#6b7b90">表二 · 对照项目表</text>
<rect x="74" y="461" width="294" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="86" y="485" xml:space="preserve" font-size="15" fill="#263a53">项目清单.xlsx</text>
<rect x="74" y="503" width="120" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="86" y="526" xml:space="preserve" font-size="15" fill="#215eb8">更换表二</text>
<text x="74" y="588" xml:space="preserve" font-size="15" fill="#6b7b90">表一、表二名称可修改。</text>
<text x="74" y="614" xml:space="preserve" font-size="15" fill="#6b7b90">可在右侧查看并对应表头。</text>
<rect x="402" y="244" width="1142" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="420" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">分析设置 / 对比结果</text>
<rect x="1402" y="260" width="120" height="34" rx="4" fill="#215eb8" stroke="#215eb8"/>
<text x="1414" y="283" xml:space="preserve" font-size="15" fill="white">执行</text>
<text x="422" y="317" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">比较模板：项目关联模板（示意）</text>
<rect x="420" y="345" width="1104" height="36" rx="0" fill="#eef2f7"/>
<text x="430" y="369" xml:space="preserve" font-size="14" fill="#6b7b90">比较内容</text>
<text x="680" y="369" xml:space="preserve" font-size="14" fill="#6b7b90">表一列名</text>
<text x="1107" y="369" xml:space="preserve" font-size="14" fill="#6b7b90">表二列名</text>
<text x="430" y="403" xml:space="preserve" font-size="14" fill="#263a53">项目名称</text>
<text x="680" y="403" xml:space="preserve" font-size="14" fill="#263a53">项目名称 ▾</text>
<text x="1107" y="403" xml:space="preserve" font-size="14" fill="#263a53">工程名称 ▾</text>
<path d="M420 430 h1104" stroke="#dce3ed"/>
<rect x="420" y="430" width="1104" height="49" rx="0" fill="#f8fafc"/>
<text x="430" y="452" xml:space="preserve" font-size="14" fill="#263a53">建设单位</text>
<text x="680" y="452" xml:space="preserve" font-size="14" fill="#263a53">申报单位 ▾</text>
<text x="1107" y="452" xml:space="preserve" font-size="14" fill="#263a53">建设单位 ▾</text>
<path d="M420 479 h1104" stroke="#dce3ed"/>
<text x="430" y="501" xml:space="preserve" font-size="14" fill="#263a53">建设地点</text>
<text x="680" y="501" xml:space="preserve" font-size="14" fill="#263a53">项目地点 ▾</text>
<text x="1107" y="501" xml:space="preserve" font-size="14" fill="#263a53">建设地址 ▾</text>
<path d="M420 528 h1104" stroke="#dce3ed"/>
<text x="423" y="570" xml:space="preserve" font-size="16" fill="#215eb8">3组字段已对应    ·    查看比较规则</text>
<text x="423" y="616" xml:space="preserve" font-size="16" fill="#215eb8">▸ 高级设置：模式、候选上限、锁定策略、评分阈值</text>
<text x="423" y="667" xml:space="preserve" font-size="15" fill="#6b7b90">批量模式可能截断候选；当前模式与范围必须可查看。</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">2份表格 · 3组字段已对应 · 模板已就绪，可执行分析。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">资料角色清楚，字段映射改成紧凑对应表；先让用户确认比较的是哪两列。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">保留原模式和锁定规则，不能用“更快”一词掩盖候选覆盖变化。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">没有完整未匹配集合时只显示候选组数，不推断其他记录都无关联。</text>
</svg>