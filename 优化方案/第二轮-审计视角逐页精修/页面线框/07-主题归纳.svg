<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>主题归纳：逐页精修设计</title>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f4f6fa"/>
<text x="40" y="48" xml:space="preserve" font-size="29" fill="#263a53" font-weight="700">07 / 主题归纳</text>
<text x="40" y="84" xml:space="preserve" font-size="16" fill="#6b7b90">静态设计评审 · 保留现有业务流程 · 示例名称、内容及数量均为虚构</text>
<rect x="1323" y="29" width="233" height="26" rx="4" fill="#edf4ff"/>
<text x="1332" y="47" xml:space="preserve" font-size="13" fill="#215eb8">V0.2 · 最小改动</text>
<rect x="40" y="126" width="1520" height="642" rx="6" fill="white" stroke="#dce3ed"/>
<text x="58" y="163" xml:space="preserve" font-size="22" fill="#263a53" font-weight="700">主题归纳</text>
<rect x="405" y="142" width="175" height="26" rx="4" fill="#edf4ff"/>
<text x="414" y="160" xml:space="preserve" font-size="13" fill="#215eb8">准备执行</text>
<text x="1365" y="162" xml:space="preserve" font-size="15" fill="#215eb8">任务中心   关闭 ×</text>
<text x="58" y="207" xml:space="preserve" font-size="17" fill="#6b7b90">先提取基础信息，再归纳主要主题；一次执行完成两步。</text>
<path d="M40 226 h1520" stroke="#dce3ed"/>
<rect x="56" y="244" width="236" height="458" rx="6" fill="#f9fbfd" stroke="#dce3ed"/>
<text x="72" y="276" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">本次资料 · 23份资料</text>
<rect x="72" y="291" width="204" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="84" y="314" xml:space="preserve" font-size="15" fill="#215eb8">＋ 添加文件</text>
<rect x="72" y="339" width="204" height="32" rx="6" fill="white" stroke="#dce3ed"/>
<text x="83" y="361" xml:space="preserve" font-size="14" fill="#6b7b90">搜索本次资料</text>
<text x="72" y="405" xml:space="preserve" font-size="15" fill="#263a53" font-weight="700">▾ 项目资料</text>
<rect x="65" y="419" width="218" height="34" rx="3" fill="#edf4ff"/>
<text x="84" y="442" xml:space="preserve" font-size="14" fill="#215eb8">采购合同.pdf</text>
<text x="84" y="480" xml:space="preserve" font-size="14" fill="#263a53">补充协议.pdf</text>
<text x="84" y="518" xml:space="preserve" font-size="14" fill="#263a53">项目说明.docx</text>
<text x="84" y="556" xml:space="preserve" font-size="14" fill="#263a53">验收记录.pdf</text>
<text x="72" y="610" xml:space="preserve" font-size="14" fill="#215eb8">管理资料 / 查看执行范围</text>
<rect x="72" y="650" width="204" height="34" rx="4" fill="#215eb8" stroke="#215eb8"/>
<text x="84" y="673" xml:space="preserve" font-size="15" fill="white">执行</text>
<rect x="308" y="244" width="830" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="326" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">原文预览</text>
<text x="951" y="274" xml:space="preserve" font-size="14" fill="#6b7b90">第 2 / 8 页  ·  全屏</text>
<rect x="348" y="300" width="750" height="373" rx="6" fill="#fbfcfe" stroke="#dce3ed"/>
<text x="374" y="337" xml:space="preserve" font-size="20" fill="#263a53" font-weight="700">项目说明.docx</text>
<text x="374" y="382" xml:space="preserve" font-size="16" fill="#263a53">甲方：示例单位A</text>
<text x="374" y="424" xml:space="preserve" font-size="16" fill="#263a53">乙方：示例供应商B</text>
<text x="374" y="466" xml:space="preserve" font-size="16" fill="#263a53">一、项目概况</text>
<text x="374" y="508" xml:space="preserve" font-size="16" fill="#263a53">本项目采购办公设备，用于业务办公。</text>
<text x="374" y="550" xml:space="preserve" font-size="16" fill="#263a53">二、具体交付与验收安排见合同条款。</text>
<rect x="1154" y="244" width="390" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1172" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">分析设置</text>
<text x="1172" y="310" xml:space="preserve" font-size="15" fill="#6b7b90">1 提取基础信息</text>
<rect x="1172" y="322" width="354" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1184" y="346" xml:space="preserve" font-size="15" fill="#263a53">基础信息提取模板 ▾</text>
<text x="1172" y="390" xml:space="preserve" font-size="15" fill="#215eb8">查看 / 调整提取要求</text>
<text x="1172" y="449" xml:space="preserve" font-size="15" fill="#6b7b90">2 归纳主要主题</text>
<rect x="1172" y="461" width="354" height="36" rx="6" fill="white" stroke="#dce3ed"/>
<text x="1184" y="485" xml:space="preserve" font-size="15" fill="#263a53">主题归纳模板 ▾</text>
<text x="1172" y="529" xml:space="preserve" font-size="15" fill="#215eb8">查看 / 调整归纳要求</text>
<path d="M1172 559 h354" stroke="#dce3ed"/>
<text x="1172" y="596" xml:space="preserve" font-size="16" fill="#263a53">输出：</text>
<text x="1172" y="625" xml:space="preserve" font-size="16" fill="#263a53">资料基础信息表</text>
<text x="1172" y="654" xml:space="preserve" font-size="16" fill="#263a53">主题归纳说明</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">执行后可查看基础信息表和主题归纳说明。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">两大段常驻提示词改为两张摘要卡，串联流程不增加第二次手动执行。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">指定关注方向先通过已有授权prompt编辑承载；主题表导入单列后续。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">保留真实表格和归纳文本输出，不改画成不存在的主题关系数据库。</text>
</svg>