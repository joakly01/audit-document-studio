<text x="74" y="474" xml:space="preserve" font-size="16" fill="#263a53">▸ 项目空间</text>
<text x="74" y="522" xml:space="preserve" font-size="16" fill="#263a53">▸ 公共空间</text>
<text x="325" y="275" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">演示项目 / 采购资料 · 包含子目录</text>
<rect x="325" y="298" width="192" height="34" rx="4" fill="white" stroke="#dce3ed"/>
