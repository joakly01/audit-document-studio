<rect x="534" y="298" width="200" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="546" y="321" xml:space="preserve" font-size="15" fill="#215eb8">选择所有页（24）</text>
<rect x="323" y="351" width="815" height="36" rx="0" fill="#eef2f7"/>
<text x="333" y="375" xml:space="preserve" font-size="14" fill="#6b7b90">选择 / 文件</text>
<text x="743" y="375" xml:space="preserve" font-size="14" fill="#6b7b90">状态</text>
<text x="883" y="375" xml:space="preserve" font-size="14" fill="#6b7b90">来源目录</text>
<text x="333" y="409" xml:space="preserve" font-size="14" fill="#263a53">☑ 采购合同.pdf</text>
