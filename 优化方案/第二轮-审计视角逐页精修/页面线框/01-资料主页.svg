<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">已选资料将带入工具；不适用或尚未解析的资料会明确说明。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">保留目录、文件表和工具箱；通过一行用途说明帮助新用户选对工具。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">空间和资料路径持续可见；工具仍由权限接口决定，不新建工具门户。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">文件名、状态与已选范围优先，低频元信息进详情。</text>
