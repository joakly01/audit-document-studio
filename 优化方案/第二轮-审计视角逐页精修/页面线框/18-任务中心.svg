<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>任务中心：逐页精修设计</title>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f4f6fa"/>
<text x="40" y="48" xml:space="preserve" font-size="29" fill="#263a53" font-weight="700">18 / 任务中心</text>
<text x="40" y="84" xml:space="preserve" font-size="16" fill="#6b7b90">静态设计评审 · 保留现有业务流程 · 示例名称、内容及数量均为虚构</text>
<rect x="1323" y="29" width="233" height="26" rx="4" fill="#edf4ff"/>
<text x="1332" y="47" xml:space="preserve" font-size="13" fill="#215eb8">V0.2 · 最小改动</text>
<rect x="40" y="126" width="1520" height="642" rx="6" fill="white" stroke="#dce3ed"/>
<text x="58" y="163" xml:space="preserve" font-size="22" fill="#263a53" font-weight="700">任务中心</text>
<rect x="405" y="142" width="175" height="26" rx="4" fill="#edf4ff"/>
<text x="414" y="160" xml:space="preserve" font-size="13" fill="#215eb8">任务列表</text>
<text x="1365" y="162" xml:space="preserve" font-size="15" fill="#215eb8">任务中心   关闭 ×</text>
<text x="58" y="207" xml:space="preserve" font-size="17" fill="#6b7b90">找回任务、查看结果，继续处理失败资料或待填写信息。</text>
<path d="M40 226 h1520" stroke="#dce3ed"/>
<rect x="60" y="247" width="158" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="72" y="270" xml:space="preserve" font-size="15" fill="#215eb8">状态：全部 ▾</text>
<rect x="234" y="247" width="176" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="246" y="270" xml:space="preserve" font-size="15" fill="#215eb8">工具：全部 ▾</text>
<rect x="427" y="247" width="390" height="34" rx="6" fill="white" stroke="#dce3ed"/>
<text x="440" y="270" xml:space="preserve" font-size="15" fill="#6b7b90">搜索任务名称</text>
<rect x="1249" y="247" width="115" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="1261" y="270" xml:space="preserve" font-size="15" fill="#215eb8">刷新</text>
<rect x="1379" y="247" width="163" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="1391" y="270" xml:space="preserve" font-size="15" fill="#215eb8">合并导出</text>
<rect x="58" y="310" width="1486" height="36" rx="0" fill="#eef2f7"/>
<text x="68" y="334" xml:space="preserve" font-size="14" fill="#6b7b90">任务名称 / 工具</text>
<text x="478" y="334" xml:space="preserve" font-size="14" fill="#6b7b90">资料范围</text>
<text x="648" y="334" xml:space="preserve" font-size="14" fill="#6b7b90">状态与阶段</text>
<text x="1048" y="334" xml:space="preserve" font-size="14" fill="#6b7b90">创建时间</text>
<text x="1258" y="334" xml:space="preserve" font-size="14" fill="#6b7b90">操作</text>
<text x="68" y="368" xml:space="preserve" font-size="14" fill="#263a53">合同提取 / 信息提取</text>
<text x="478" y="368" xml:space="preserve" font-size="14" fill="#263a53">23份</text>
<text x="648" y="368" xml:space="preserve" font-size="14" fill="#263a53">22成功，1失败</text>
<text x="1048" y="368" xml:space="preserve" font-size="14" fill="#263a53">今天 10:20</text>
<text x="1258" y="368" xml:space="preserve" font-size="14" fill="#215eb8">查看结果 / 失败1</text>
<path d="M58 416 h1486" stroke="#dce3ed"/>
<rect x="58" y="416" width="1486" height="70" rx="0" fill="#f8fafc"/>
<text x="68" y="438" xml:space="preserve" font-size="14" fill="#263a53">会议梳理 / 会议纪要</text>
<text x="478" y="438" xml:space="preserve" font-size="14" fill="#263a53">3份</text>
<text x="648" y="438" xml:space="preserve" font-size="14" fill="#263a53">基础完成，风险报告生成中</text>
<text x="1048" y="438" xml:space="preserve" font-size="14" fill="#263a53">今天 09:40</text>
<text x="1258" y="438" xml:space="preserve" font-size="14" fill="#215eb8">查看进度</text>
<path d="M58 486 h1486" stroke="#dce3ed"/>
<text x="68" y="508" xml:space="preserve" font-size="14" fill="#263a53">监理费 / 待摊费用</text>
<text x="478" y="508" xml:space="preserve" font-size="14" fill="#263a53">1份合同</text>
<text x="648" y="508" xml:space="preserve" font-size="14" fill="#263a53">待填写计费基数</text>
<text x="1048" y="508" xml:space="preserve" font-size="14" fill="#263a53">昨天 16:00</text>
<text x="1258" y="508" xml:space="preserve" font-size="14" fill="#263a53">继续填写</text>
<path d="M58 556 h1486" stroke="#dce3ed"/>
<rect x="58" y="556" width="1486" height="70" rx="0" fill="#f8fafc"/>
<text x="68" y="578" xml:space="preserve" font-size="14" fill="#263a53">工程关联 / 两表关联</text>
<text x="478" y="578" xml:space="preserve" font-size="14" fill="#263a53">2份表格</text>
<text x="648" y="578" xml:space="preserve" font-size="14" fill="#263a53">已完成</text>
<text x="1048" y="578" xml:space="preserve" font-size="14" fill="#263a53">昨天 14:30</text>
<text x="1258" y="578" xml:space="preserve" font-size="14" fill="#215eb8">查看结果</text>
<path d="M58 626 h1486" stroke="#dce3ed"/>
<text x="61" y="665" xml:space="preserve" font-size="15" fill="#6b7b90">共4条  ·  返回时保留筛选与页码</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">共4条任务；点击对应操作查看结果、进度或继续填写。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">已有任务中心继续使用；操作随阶段变，不是每行统一“查看/删除”。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">待人工输入必须能被发现；进度摘要收敛，细日志放详情。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">合并导出按现有支持的任务条件，不开放无意义勾选。</text>
</svg>