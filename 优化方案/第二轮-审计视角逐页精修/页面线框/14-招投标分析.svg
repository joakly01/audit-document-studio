<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>招投标分析：逐页精修设计</title>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f4f6fa"/>
<text x="40" y="48" xml:space="preserve" font-size="29" fill="#263a53" font-weight="700">14 / 招投标分析</text>
<text x="40" y="84" xml:space="preserve" font-size="16" fill="#6b7b90">静态设计评审 · 保留现有业务流程 · 示例名称、内容及数量均为虚构</text>
<rect x="1323" y="29" width="233" height="26" rx="4" fill="#edf4ff"/>
<text x="1332" y="47" xml:space="preserve" font-size="13" fill="#215eb8">V0.2 · 最小改动</text>
<rect x="40" y="126" width="1520" height="642" rx="6" fill="white" stroke="#dce3ed"/>
<text x="58" y="163" xml:space="preserve" font-size="22" fill="#263a53" font-weight="700">招投标分析</text>
<rect x="405" y="142" width="175" height="26" rx="4" fill="#edf4ff"/>
<text x="414" y="160" xml:space="preserve" font-size="13" fill="#215eb8">资料与配置</text>
<text x="1365" y="162" xml:space="preserve" font-size="15" fill="#215eb8">任务中心   关闭 ×</text>
<text x="58" y="207" xml:space="preserve" font-size="17" fill="#6b7b90">按项目和投标单位整理资料，选择分析内容，查看规则结果与证据。</text>
<path d="M40 226 h1520" stroke="#dce3ed"/>
<rect x="56" y="244" width="330" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="74" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">项目资料</text>
<text x="74" y="312" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">项目A · 设备采购</text>
<text x="74" y="352" xml:space="preserve" font-size="15" fill="#263a53">招标文件：已添加1份</text>
<text x="74" y="396" xml:space="preserve" font-size="15" fill="#263a53">投标单位A：文件1份</text>
<text x="74" y="437" xml:space="preserve" font-size="15" fill="#986515">投标单位B：待添加文件</text>
<rect x="74" y="469" width="290" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="86" y="492" xml:space="preserve" font-size="15" fill="#215eb8">添加该单位投标文件</text>
<text x="74" y="552" xml:space="preserve" font-size="15" fill="#215eb8">＋ 新增投标单位</text>
<text x="74" y="592" xml:space="preserve" font-size="15" fill="#215eb8">＋ 新增项目</text>
<rect x="74" y="650" width="290" height="34" rx="4" fill="#215eb8" stroke="#215eb8"/>
<text x="86" y="673" xml:space="preserve" font-size="15" fill="white">执行</text>
<rect x="402" y="244" width="1142" height="458" rx="6" fill="white" stroke="#dce3ed"/>
<text x="420" y="274" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">1 整理资料 → 2 选择分析内容 → 3 查看结果</text>
<rect x="420" y="302" width="351" height="126" rx="6" fill="#edf4ff" stroke="#dce3ed"/>
<text x="436" y="335" xml:space="preserve" font-size="18" fill="#215eb8" font-weight="700">☑ 招标文件分析</text>
<text x="436" y="374" xml:space="preserve" font-size="15" fill="#6b7b90">检查招标文件相关规则</text>
<rect x="789" y="302" width="351" height="126" rx="6" fill="#edf4ff" stroke="#dce3ed"/>
<text x="805" y="335" xml:space="preserve" font-size="18" fill="#215eb8" font-weight="700">☑ 投标文件分析</text>
<text x="805" y="374" xml:space="preserve" font-size="15" fill="#6b7b90">按投标单位查看相关规则</text>
<rect x="1158" y="302" width="351" height="126" rx="6" fill="#edf4ff" stroke="#dce3ed"/>
<text x="1174" y="335" xml:space="preserve" font-size="18" fill="#215eb8" font-weight="700">☑ 招投标联合分析</text>
<text x="1174" y="374" xml:space="preserve" font-size="15" fill="#6b7b90">同项目需同时有两类资料</text>
<rect x="420" y="447" width="1104" height="144" rx="6" fill="white" stroke="#dce3ed"/>
<text x="439" y="479" xml:space="preserve" font-size="18" fill="#263a53" font-weight="700">分析模板：标准分析模板（示意）</text>
<text x="439" y="519" xml:space="preserve" font-size="16" fill="#6b7b90">已选分析内容对应的检查规则，默认收起全文。</text>
<rect x="1296" y="474" width="208" height="34" rx="4" fill="white" stroke="#dce3ed"/>
<text x="1308" y="497" xml:space="preserve" font-size="15" fill="#215eb8">查看检查规则</text>
<text x="439" y="564" xml:space="preserve" font-size="15" fill="#6b7b90">系统模板 · 规则由授权人员维护。</text>
<text x="420" y="632" xml:space="preserve" font-size="16" fill="#986515">资料提示：投标单位B尚未添加文件，请补充或从本次归组中移出；实际执行范围以就绪清单为准。</text>
<rect x="74" y="650" width="290" height="34" rx="4" fill="#e5e9ef"/>
<text x="86" y="673" xml:space="preserve" font-size="15" fill="#8793a3">执行</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">请补充投标单位B的文件，或移出该单位；执行前核对项目归组和资料角色。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">保留项目与投标单位结构，不扁平化为普通文档树。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">逐项目显示缺项，规则默认摘要，不用几十个标签和长提示词铺满首屏。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">模式与最低材料条件沿用已有逻辑；部分就绪是否可执行必须照真实服务。</text>
</svg>