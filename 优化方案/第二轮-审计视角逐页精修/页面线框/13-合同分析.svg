<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">结果优先检查项、判断、摘要；长依据与分析思路进入展开详情。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">准备态先合同类型、模板和规则摘要，只有全部必需项齐全才提示就绪。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">不把缺值自动解释为符合，不把模型判断包装成已经核定的审计结论。</text>
