<text x="1172" y="445" xml:space="preserve" font-size="16" fill="#263a53">当前筛选只影响查看。</text>
<text x="1172" y="477" xml:space="preserve" font-size="16" fill="#263a53">上传时间不作为事项日期。</text>
<text x="1172" y="573" xml:space="preserve" font-size="15" fill="#215eb8">查看本次分析要求</text>
<path d="M40 718 h1520" stroke="#dce3ed"/>
<text x="58" y="749" xml:space="preserve" font-size="15" fill="#6b7b90">当前显示全部日期范围，共3条事项记录。</text>
<text x="40" y="818" xml:space="preserve" font-size="17" fill="#263a53" font-weight="700">产品经理批注</text>
<text x="40" y="852" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">01</text>
<text x="80" y="852" xml:space="preserve" font-size="16" fill="#6b7b90">结果页按现有数据范围初始化，筛选为空有“清除筛选”动作。</text>
<text x="40" y="897" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">02</text>
<text x="80" y="897" xml:space="preserve" font-size="16" fill="#6b7b90">未识别日期和日期精度仅在真实返回支持时显示，不补成今天。</text>
<text x="40" y="942" xml:space="preserve" font-size="16" fill="#215eb8" font-weight="700">03</text>
<text x="80" y="942" xml:space="preserve" font-size="16" fill="#6b7b90">预览仍用现有弹窗；不承诺自动提取每一个业务履行节点。</text>
