server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/audit-document-studio/current;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/audit-document-studio.access.log;
    error_log /var/log/nginx/audit-document-studio.error.log;

    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ (^|/)\. {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Ubuntu's default MIME registry does not include JavaScript modules.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Navigation uses URL fragments; missing assets must remain real 404s.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
